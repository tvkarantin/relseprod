name: Inspect free reel metrics source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-instagram-metadata.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GWAA viewer transport
        run: |
          set -euo pipefail
          curl -L --silent --show-error 'https://reels.gwaa.net/' -o /tmp/gwaa.html
          echo '--- scripts ---'
          grep -Eo '<script[^>]+src=["'"'][^"'"']+' /tmp/gwaa.html | head -30 || true
          echo '--- form/action/api hints ---'
          grep -Eo '(action|endpoint|fetch|axios|api)[^<"'"']{0,120}' /tmp/gwaa.html | head -80 || true
          echo '--- likely URLs ---'
          grep -Eo 'https?://[^"'"' <]+' /tmp/gwaa.html | sort -u | head -80 || true
          echo '--- query candidates ---'
          for url in \
            'https://reels.gwaa.net/?username=nick_saraev' \
            'https://reels.gwaa.net/?q=nick_saraev' \
            'https://reels.gwaa.net/nick_saraev' \
            'https://gwaa.net/instagram-reels-viewer?username=nick_saraev'; do
            echo "URL=$url"
            page=$(curl -L --silent --show-error "$url")
            printf '%s' "$page" | grep -o 'Db52rxbPh6i' | head -1 || true
            printf '%s' "$page" | grep -Eo 'nick_saraev.{0,100}' | head -3 || true
          done
