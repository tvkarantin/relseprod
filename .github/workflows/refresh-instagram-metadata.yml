name: Inspect SilentPeek reel metadata transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-instagram-metadata.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect SilentPeek transport
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142 Safari/537.36'
          base='https://silentpeek.com/reels-viewer'
          req=urllib.request.Request(base,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=25) as r:
              html=r.read().decode('utf-8','ignore')
              print('HOME',r.status,r.geturl(),'bytes',len(html))

          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('SCRIPTS',scripts[:40])

          def inspect(label,text):
              print('\n###',label,'bytes',len(text))
              patterns=[
                  r'fetch\((.{0,320})',
                  r'axios[^;]{0,320}',
                  r'https?://[^"\'\s<>]+',
                  r'/api/[A-Za-z0-9_?&=./:{}$%-]+',
                  r'(?i)(?:play_count|view_count|viewsCount|playCount|shortcode|thumbnail|cover_url|display_url).{0,260}',
              ]
              for pat in patterns:
                  vals=re.findall(pat,text)
                  if vals:
                      print('PAT',pat)
                      for v in vals[:80]: print(str(v)[:520])

          inspect('HTML',html)
          for src in scripts[:30]:
              url=urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':base})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      js=r.read().decode('utf-8','ignore')
              except Exception as exc:
                  print('SCRIPT_FAIL',url,type(exc).__name__,str(exc)[:120])
                  continue
              low=js.lower()
              if any(x in low for x in ['fetch(','/api/','shortcode','play_count','view_count','reels']):
                  inspect(url,js)
          PY
