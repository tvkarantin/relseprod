name: Inspect free reel metrics source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-instagram-metadata.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GWAA viewer transport
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142 Safari/537.36'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.geturl(), r.read().decode('utf-8', 'ignore')

          base = 'https://reels.gwaa.net/'
          final, html = get(base)
          print('HOME', final, 'bytes', len(html))
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          print('SCRIPTS', scripts[:30])
          for src in scripts[:20]:
              url = urljoin(base, src)
              try:
                  _, js = get(url)
              except Exception as exc:
                  print('SCRIPT_FAIL', url, type(exc).__name__)
                  continue
              hints = sorted(set(re.findall(r'(?:https?://[^"\'\s]+|/api/[A-Za-z0-9_?&=./:{}$-]+)', js)))
              fetches = re.findall(r'fetch\((.{0,180})', js)
              if hints or fetches:
                  print('SCRIPT', url, 'bytes', len(js))
                  print('URL_HINTS', hints[:40])
                  print('FETCH_HINTS', fetches[:20])

          for url in [
              'https://reels.gwaa.net/?username=nick_saraev',
              'https://reels.gwaa.net/?q=nick_saraev',
              'https://reels.gwaa.net/nick_saraev',
              'https://gwaa.net/instagram-reels-viewer?username=nick_saraev',
          ]:
              try:
                  final, page = get(url)
                  print('CANDIDATE', url, '->', final, 'bytes', len(page), 'has_shortcode', 'Db52rxbPh6i' in page, 'has_username', 'nick_saraev' in page)
              except Exception as exc:
                  print('CANDIDATE_FAIL', url, type(exc).__name__, str(exc)[:160])
          PY
