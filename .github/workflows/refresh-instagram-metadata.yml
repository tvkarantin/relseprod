name: Inspect free reel metrics source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-instagram-metadata.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect inline GWAA transport
        run: |
          python - <<'PY'
          import re
          import urllib.request

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142 Safari/537.36'
          url = 'https://reels.gwaa.net/'
          req = urllib.request.Request(url, headers={'User-Agent': UA})
          with urllib.request.urlopen(req, timeout=20) as r:
              html = r.read().decode('utf-8', 'ignore')

          print('BYTES', len(html))
          patterns = {
              'fetch': r'fetch\((.{0,420})',
              'api': r'(?i)(?:https?://[^"\'\s<>]+|/api/[A-Za-z0-9_?&=./:{}$%-]+)',
              'xhr': r'(?i)(?:XMLHttpRequest|axios|endpoint|lookup|search|profile|username).{0,260}',
              'action': r'(?i)<form[^>]+action=["\']([^"\']+)',
          }
          for name, pattern in patterns.items():
              print('\n---', name, '---')
              values = re.findall(pattern, html)
              for value in values[:120]:
                  print(value if isinstance(value, str) else repr(value))

          needles = [
              'Paste a Reel URL or username',
              'Enter username',
              'play_count',
              'playCount',
              'view_count',
              'viewCount',
              '/api/',
              'fetch(',
              'iv-',
          ]
          for needle in needles:
              print('\n=== NEEDLE', needle, '===')
              start = 0
              hits = 0
              low = html.lower()
              target = needle.lower()
              while hits < 12:
                  idx = low.find(target, start)
                  if idx < 0:
                      break
                  print(html[max(0, idx-700):min(len(html), idx+1500)].replace('\n', ' ')[:2200])
                  print('---')
                  start = idx + len(target)
                  hits += 1
          PY
