name: Rebrand product to RealsFlow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy display brand everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              "RealsFinder": "RealsFlow",
              "Reals Finder": "RealsFlow",
              "Realsfinder": "RealsFlow",
              "REALSFINDER": "REALSFLOW",
          }

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []
          for raw in files:
              if not raw or raw == ".github/workflows/rebrand-realsflow.yml":
                  continue
              path = Path(raw)
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(raw)

          print("Changed files:")
          for item in changed:
              print(item)
          PY

      - name: Commit rebrand
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy display-brand references found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rename product brand to RealsFlow"
          git push origin HEAD:main
