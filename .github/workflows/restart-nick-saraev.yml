name: Restart nick_saraev import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-nick-saraev.yml'

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart production import
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"importMode":"popular"}' \
            https://realsfinder-api.vercel.app/api/v1/competitors/6/parse)
          echo "$response"
