name: Debug nick_saraev Instagram lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-nick-saraev.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase Instagram lookup
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://tphahouachokghqlsczf.supabase.co/functions/v1/instagram-summary-check?username=nick_saraev'
          echo

      - name: Inspect Instagram topsearch result
        run: |
          set -euo pipefail
          csrf=$(python - <<'PY'
          import uuid
          print(uuid.uuid4().hex)
          PY
          )
          curl --fail-with-body --silent --show-error \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36' \
            -H 'Accept: */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'X-IG-App-ID: 936619743392459' \
            -H "X-CSRFToken: $csrf" \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Referer: https://www.instagram.com/' \
            -H "Cookie: csrftoken=$csrf; ig_nrcb=1" \
            'https://www.instagram.com/web/search/topsearch/?query=nick_saraev' \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"username": (x.get("user") or {}).get("username"), "pk": (x.get("user") or {}).get("pk"), "id": (x.get("user") or {}).get("id")} for x in d.get("users", [])[:10]], ensure_ascii=False))'
