name: Build Vercel frontend artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: apps/api
        run: python -m ruff check .

      - name: Pytest
        working-directory: apps/api
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm run test

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Add Vercel rewrites
        run: |
          cat > apps/web/dist/vercel.json <<'EOF'
          {
            "rewrites": [
              { "source": "/api/:path*", "destination": "https://realsfinder-api.vercel.app/api/:path*" },
              { "source": "/((?!assets/|api/).*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: realsfinder-vercel-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Publish production dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/realsfinder-vercel-dist
          cp -R apps/web/dist /tmp/realsfinder-vercel-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vercel-dist
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/realsfinder-vercel-dist/. .
          git add -A
          git commit -m "build: web dist ${GITHUB_SHA}"
          git push --force origin HEAD:vercel-dist
