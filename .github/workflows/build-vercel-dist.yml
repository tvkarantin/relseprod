name: Build Vercel frontend artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realsfinder-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: apps/api
        run: python -m ruff check .

      - name: Pytest
        working-directory: apps/api
        run: python -m pytest

      - name: Upload tested backend source
        uses: actions/upload-artifact@v4
        with:
          name: realsfinder-api-source
          path: apps/api
          if-no-files-found: error
          retention-days: 1

  deploy-backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy backend to Vercel production
        working-directory: apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_dbSmvb6n3SjBzoggnorPzBVI
          VERCEL_PROJECT_ID: prj_MJwGKXuKQt4h2rZZoGtZ2RyBsL7G
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN repository secret"
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm run test

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Add Vercel rewrites
        run: |
          cat > apps/web/dist/vercel.json <<'EOF'
          {
            "rewrites": [
              { "source": "/api/:path*", "destination": "https://realsfinder-api.vercel.app/api/:path*" },
              { "source": "/((?!assets/|api/).*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: realsfinder-vercel-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Prepare Vercel prebuilt output
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R apps/web/dist/. .vercel/output/static/
          rm -f .vercel/output/static/vercel.json
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "src": "^/api/(.*)$", "dest": "https://realsfinder-api.vercel.app/api/$1" },
              { "handle": "filesystem" },
              { "src": "^/.*$", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy frontend to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_dbSmvb6n3SjBzoggnorPzBVI
          VERCEL_PROJECT_ID: prj_xKs3JgvKrdyKi2a9vpRhRjjGP4HR
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN repository secret"
            exit 1
          fi
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
