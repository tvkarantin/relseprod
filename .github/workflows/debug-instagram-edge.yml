name: Verify Imginn Production Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-instagram-edge.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Start nick_saraev production import
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"importMode":"popular"}' \
            https://realsfinder-api.vercel.app/api/v1/competitors/6/parse
          echo
