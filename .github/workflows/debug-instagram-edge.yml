name: Debug Instagram Profile Markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-instagram-edge.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect markup from a working edge region
        run: |
          set -euo pipefail
          curl --silent --show-error \
            'https://tphahouachokghqlsczf.supabase.co/functions/v1/noop?forceFunctionRegion=ap-northeast-1' \
            | python -c 'import json,sys; d=json.load(sys.stdin); print("status",d.get("status")); print("matches",d.get("matches")); print("snippet",d.get("snippet"))'
