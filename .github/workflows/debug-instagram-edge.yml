name: Verify Instagram Media Proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-instagram-edge.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check video and thumbnail proxy
        run: |
          set -euo pipefail
          video='https://tphahouachokghqlsczf.supabase.co/functions/v1/instagram-imginn?media=Db52rxbPh6i&forceFunctionRegion=ap-northeast-1'
          thumb='https://tphahouachokghqlsczf.supabase.co/functions/v1/instagram-imginn?thumbnail=Db52rxbPh6i&forceFunctionRegion=ap-northeast-1'
          echo 'VIDEO:'
          curl --fail-with-body --silent --show-error -L --max-redirs 3 -o /dev/null -w '%{http_code} %{content_type}\n' "$video"
          echo 'THUMBNAIL:'
          curl --fail-with-body --silent --show-error -L --max-redirs 3 -o /dev/null -w '%{http_code} %{content_type}\n' "$thumb"
