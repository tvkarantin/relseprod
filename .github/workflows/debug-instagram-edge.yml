name: Debug Instagram Topsearch Regions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-instagram-edge.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probe topsearch from Supabase regions
        run: |
          set -euo pipefail
          regions=(ap-northeast-1 ap-northeast-2 ap-south-1 ap-southeast-1 us-east-1 eu-west-2)
          for region in "${regions[@]}"; do
            echo "=== $region ==="
            curl --silent --show-error \
              "https://tphahouachokghqlsczf.supabase.co/functions/v1/instagram-summary-check?username=nick_saraev&forceFunctionRegion=$region"
            echo
          done
