name: Inspect Nick Saraev Instagram metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reimport-nick-saraev.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Tokyo Instagram metadata probe
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://tphahouachokghqlsczf.supabase.co/functions/v1/instagram-meta-probe?username=nick_saraev&forceFunctionRegion=ap-northeast-1'
