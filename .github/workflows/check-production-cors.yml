name: Verify production frontend CORS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-production-cors.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS from live frontend origin
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          curl --fail-with-body --silent --show-error \
            -D "$headers" -o "$body" \
            -H 'Origin: https://realsfinder-github.vercel.app' \
            'https://realsfinder-api.vercel.app/api/v1/reels?sort=viral&page=1&limit=1'
          cat "$headers"
          echo 'BODY:'
          cat "$body"
          grep -qi '^access-control-allow-origin: https://realsfinder-github.vercel.app' "$headers"
