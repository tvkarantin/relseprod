[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-finder-api"
version = "0.1.0"
description = "Reels Finder backend API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "typing-extensions>=4.12",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade / modern python
    "C4",  # comprehensions
    "SIM", # simplify
    "TCH", # type-checking imports
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "ANN", # annotations
]
ignore = [
    "ANN401", # typing.Any is used deliberately in a few generic helpers
    # The project speaks Russian to its users: Cyrillic letters in messages are
    # intentional, not homoglyph typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI TestClient is used at runtime in fixtures and assertions.
"tests/*" = ["ANN201", "ANN001", "TC002", "TC003"]
"migrations/env.py" = ["ANN201", "E402"]
"scripts/*" = ["T201"]  # the dev script intentionally prints to stdout
# FastAPI resolves annotations at runtime (dependency injection, response
# models), so `Session`, `Generator` & co. must be imported unconditionally in
# these modules — a `TYPE_CHECKING` block would break the app at startup.
"app/api/deps.py" = ["TC002", "TC003"]
"app/api/v1/router.py" = ["TC002", "TC003"]
"app/api/v1/competitors.py" = ["TC002", "TC003"]
"app/api/v1/jobs.py" = ["TC002", "TC003"]
"app/api/v1/reels.py" = ["TC001", "TC002", "TC003"]
"app/api/v1/dashboard.py" = ["TC002", "TC003"]
"app/main.py" = ["TC002", "TC003"]
"app/database/session.py" = ["TC002", "TC003"]
# SQLAlchemy resolves `Mapped[...]` annotations at mapper configuration time,
# so `datetime` must be a real runtime import in the ORM models.
"app/models/*.py" = ["TC003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy evaluate annotations at runtime, so their imports must
# stay outside `if TYPE_CHECKING` blocks.
# Pydantic evaluates annotations at runtime, so its imports must stay outside
# `if TYPE_CHECKING`. SQLAlchemy is deliberately *not* listed here: it resolves
# `Mapped["Reel"]` lazily through its own registry, which is what lets the ORM
# models reference each other without circular imports.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "app.schemas.base.APIModel",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = []
packages = ["app"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "migrations/versions"
