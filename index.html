<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AndreySystem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--bg:#04080d;--side:#060b12;--card:#091017;--line:#1b2530;--text:#f4f5f7;--muted:#a7afb8;--nav:#b7bec7;--active:#18212b;--green:#19ef81;--greenbg:#063321;--purple:#d264ff;--purplebg:#241730;--blue:#6270d7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}.icon{width:20px;height:20px;stroke-width:1.65}.brand{display:flex;align-items:center;gap:10px;color:#fff}.brand-mark{width:37px;height:37px;border-radius:8px;background:#fff;color:#10161d;display:grid;place-items:center}.brand-copy{font-weight:800;line-height:.9}.brand-copy b{font-size:18px}.brand-copy span{display:block;font-size:10px;letter-spacing:1.7px;margin-top:5px}.login{min-height:100vh;display:grid;place-items:center;background:#0b0f15;padding:24px}.login-shell{width:404px}.login-brand{justify-content:center;margin-bottom:26px}.login-brand .brand-mark{width:23px;height:23px;border-radius:6px}.login-brand .brand-copy b{font-size:13px}.login-brand .brand-copy span{font-size:9px}.login-card{border:1px solid #242b35;background:#11161d;border-radius:14px;padding:34px 28px 27px}.eye{width:74px;height:74px;border-radius:50%;background:#fafafa;color:#111820;display:grid;place-items:center;margin:0 auto 20px}.eye .icon{width:45px;height:45px}.login-card h1{text-align:center;font-size:18px;margin:0 0 10px}.login-card p{text-align:center;color:#91a0b6;font-size:13px;line-height:1.55}.field{margin:16px 0}.field label{display:block;color:#9ba9bc;font-size:13px;margin-bottom:8px}.field input{width:100%;height:43px;border:1px solid #27313d;background:#191f28;color:#fff;border-radius:9px;padding:0 12px;outline:0}.login-btn{width:100%;height:44px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700}.login-error{height:18px;margin-top:9px;text-align:center;color:#ff7c86;font-size:12px}.login-note{text-align:center;color:#667287;font-size:11px;margin-top:18px}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr);background:radial-gradient(920px 560px at 73% 7%,rgba(16,31,43,.17),transparent 64%),var(--bg)}.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#070d14,#060b12);border-right:1px solid #19222c;padding:29px 15px}.sidebar .brand{padding:0 11px;margin-bottom:40px}.nav-title{font-size:10px;letter-spacing:2.05px;color:#aeb5be;font-weight:800;padding:0 11px 13px}.nav-section+.nav-section{margin-top:17px}.nav-item{height:43px;border-radius:7px;display:flex;align-items:center;gap:13px;padding:0 12px;color:var(--nav);font-size:14px;margin-bottom:5px;cursor:pointer}.nav-item .icon{width:19px;height:19px}.nav-item.active{background:linear-gradient(90deg,#19222c,#161e27);color:#fff;border-left:2px solid #f0f3f7;padding-left:10px}.subnav{margin:2px 0 7px 12px;padding-left:10px;border-left:1px solid #1b2530}.subnav .nav-item{height:38px;font-size:13px}.main{padding:38px 36px 32px 45px;min-width:0}.page{display:none}.page.active{display:block}.topbar{display:flex;justify-content:space-between;gap:30px}.hero h1{font-size:42px;line-height:1.02;letter-spacing:-1.6px;margin:0 0 14px}.hero p{font-size:14px;color:#b0b7c0;margin:0}.datebox{height:46px;display:flex;align-items:center;gap:24px;padding:0 16px;border:1px solid #202a34;background:#0a1118;border-radius:10px;font-size:14px;white-space:nowrap}.datebox span{display:flex;align-items:center;gap:9px}.datebox .icon{width:18px;height:18px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:27px 0 39px}.metric,.card,.module{border:1px solid var(--line);background:linear-gradient(135deg,#0b1219,#081017 70%,#0a1118);border-radius:10px}.metric{height:187px;padding:27px 24px 21px;position:relative}.metric-icon,.card-icon{display:grid;place-items:center;background:#141d27;border-radius:8px}.metric-icon{position:absolute;right:21px;top:25px;width:42px;height:42px}.metric-value{font-size:29px;font-weight:800;margin-bottom:15px}.metric-label{font-size:14px;font-weight:700;margin-bottom:17px}.metric-desc{font-size:13px;line-height:1.65;color:#a6afb9}.section-head{margin-bottom:14px}.section-head h2{font-size:22px;margin:0 0 7px}.section-head p{font-size:13px;color:#aab2bc;margin:0}.modules-top{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.modules-bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.module{height:229px;padding:20px 23px;display:flex;flex-direction:column}.modules-bottom .module{height:239px}.module-top{display:flex;align-items:center;gap:14px;margin-bottom:17px}.card-icon{width:41px;height:41px}.status{height:34px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;background:var(--greenbg);color:var(--green);font-size:12px}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.module h3{font-size:20px;font-weight:500;margin:0 0 6px}.module p{font-size:12.5px;line-height:1.55;color:#a6afb9;margin:0}.module-bottom{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}.big{font-size:22px;font-weight:700}.small{font-size:11.5px;color:#a8b1bc;margin-top:6px}.arrow{font-size:27px;color:#c5cbd2}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}.card{min-height:248px;padding:25px 24px 22px;display:flex;flex-direction:column}.card-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}.card .card-icon{width:62px;height:62px;border-radius:12px}.card .card-icon .icon{width:31px;height:31px}.badge{height:38px;border-radius:9px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;font-size:13px;background:var(--greenbg);color:var(--green)}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.card h3{font-size:24px;line-height:1.2;margin:0 0 13px}.card p{font-size:16px;line-height:1.55;color:#aeb6bf;margin:0}.card .arrow{margin-top:auto;align-self:flex-end;font-size:34px}.edit .card-icon{background:#21182c;color:var(--purple)}.edit .badge{background:#20172b;color:#e1b9ff}.published .card-icon{background:#0c2a1c;color:#25e77e}.click{cursor:pointer;transition:.16s}.click:hover{border-color:#334150;transform:translateY(-1px)}.pipeline,.integrations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.integration{min-height:190px;padding:22px 23px}.live{color:var(--green);font-size:12px}.loading{opacity:.55}@media(max-width:1250px){.app{grid-template-columns:210px 1fr}.main{padding:30px 26px}.metrics,.grid,.pipeline,.integrations{grid-template-columns:repeat(2,1fr)}.modules-top,.modules-bottom{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px 16px}.topbar{flex-direction:column}.hero h1{font-size:34px}.metrics,.grid,.pipeline,.integrations,.modules-top,.modules-bottom{grid-template-columns:1fr}}</style></head><body><section id="login" class="login"><div class="login-shell"><div class="brand login-brand"><div class="brand-mark"><i data-lucide="box" class="icon"></i></div><div class="brand-copy"><b>ANDREY</b><span>SYSTEM</span></div></div><form class="login-card" id="loginForm"><div class="eye"><i data-lucide="eye" class="icon"></i></div><h1>Вход</h1><p>Введите логин и пароль, чтобы открыть<br>AndreySystem.</p><div class="field"><label>Логин</label><input id="user"></div><div class="field"><label>Пароль</label><input id="pass" type="password"></div><button class="login-btn">Войти</button><div class="login-error" id="err"></div></form><div class="login-note">Доступ только для владельца · попытки входа логируются</div></div></section><section id="app" class="app hidden"><aside class="sidebar"><div class="brand"><div class="brand-mark"><i data-lucide="box" class="icon"></i></div><div class="brand-copy"><b>Andrey</b><span>SYSTEM</span></div></div><div class="nav-section"><div class="nav-title">СИСТЕМА</div><div class="nav-item" data-page="overview"><i data-lucide="layout-grid" class="icon"></i>Обзор</div></div><div class="nav-section"><div class="nav-title">ПРОДУКТ</div><div class="nav-item" data-page="reels"><i data-lucide="square-play" class="icon"></i>Рилсы</div><div class="subnav"><div class="nav-item" data-page="ideas"><i data-lucide="lightbulb" class="icon"></i>Идеи</div><div class="nav-item" data-page="editing"><i data-lucide="scissors" class="icon"></i>В монтаже</div><div class="nav-item" data-page="published"><i data-lucide="circle-check" class="icon"></i>Выпущено</div></div><div class="nav-item"><i data-lucide="send" class="icon"></i>Трафик</div><div class="nav-item"><i data-lucide="funnel" class="icon"></i>Воронки</div><div class="nav-item"><i data-lucide="wallet-cards" class="icon"></i>Оплаты</div></div><div class="nav-section"><div class="nav-title">ПРОДАЖИ</div><div class="nav-item"><i data-lucide="users" class="icon"></i>Первый клиент</div><div class="nav-item" data-url="https://andreyportfolio.vercel.app"><i data-lucide="badge" class="icon"></i>Портфолио</div><div class="nav-item"><i data-lucide="workflow" class="icon"></i>Логика</div><div class="nav-item"><i data-lucide="message-circle" class="icon"></i>Личка</div></div></aside><main class="main"><section class="page" id="overview"></section><section class="page" id="reels"></section><section class="page" id="ideas"></section><section class="page" id="editing"></section><section class="page" id="published"></section></main></section><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const links={reelsfinder:'https://realsfinder-github.vercel.app',portfolio:'https://andreyportfolio.vercel.app',telegram:'https://t.me/maie_maei',youtube:'https://www.youtube.com/@AndreyLabs'};const datebox=()=>`<div class="datebox"><span><i data-lucide="calendar-days" class="icon"></i><b class="dateText">—</b></span><span><i data-lucide="clock-3" class="icon"></i><b class="timeText">—</b></span></div>`;const top=(t,p)=>`<div class="topbar"><div class="hero"><h1>${t}</h1><p>${p}</p></div>${datebox()}</div>`;const metric=(v,l,d,i,extra='')=>`<article class="metric ${extra}"><div class="metric-icon"><i data-lucide="${i}" class="icon"></i></div><div class="metric-value">${v}</div><div class="metric-label">${l}</div><div class="metric-desc">${d}</div></article>`;const module=(t,p,v,s,i,url='')=>`<article class="module ${url?'click':''}" ${url?`data-url="${url}"`:''}><div class="module-top"><div class="card-icon"><i data-lucide="${i}" class="icon"></i></div><div class="status">Работает</div></div><h3>${t}</h3><p>${p}</p><div class="module-bottom"><div><div class="big">${v}</div><div class="small">${s}</div></div><div class="arrow">→</div></div></article>`;const reel=(x,type)=>`<article class="card ${type} ${x.page||x.url?'click':''}" ${x.page?`data-go="${x.page}"`:''} ${x.url?`data-url="${x.url}"`:''}><div class="card-top"><div class="card-icon"><i data-lucide="${x.icon}" class="icon"></i></div><div class="badge">${x.badge}</div></div><h3>${x.title}</h3><p>${x.desc}</p><div class="arrow">→</div></article>`;const ideas=[['brain','5 нейросетей для контента','Подборка лучших ИИ-сервисов для генерации идей и контента.'],['magnet','Как я набираю просмотры','Разбор механик, которые привлекают аудиторию.'],['clapperboard','Сценарий за 10 минут','Пошаговая схема написания сильных сценариев.'],['target','Хуки, которые цепляют','Подборка работающих хуков для коротких видео.'],['trending-up','Тренды этой недели','Актуальные тренды и темы, которые заходят прямо сейчас.'],['camera','Идеи для Reels','Идеи роликов под разные ниши и форматы.'],['lightbulb','Боли аудитории','Какие проблемы решать в своих роликах.'],['gift','Продукт в контенте','Как ненавязчиво показывать продукт в роликах.'],['users','Форматы для вовлечения','Форматы, которые повышают комментарии и сохранения.']].map(x=>({icon:x[0],title:x[1],desc:x[2],badge:'Новая'}));const editing=[['10 ИИ-инструментов для Reels','Подборка инструментов, которые ускоряют создание контента.'],['Как набрать первые 1000 подписчиков','Пошаговая стратегия для старта и привлечения аудитории.'],['Автоматизация контента','Как автоматизировать производство и публикацию Reels.'],['Тренды Reels 2026','Разбор актуальных трендов и ниш, которые сейчас выстреливают.'],['ИИ сценарист для Reels','Как с помощью ИИ писать сценарии, которые удерживают внимание.'],['Hook\'и, которые работают','Сборник сильных хуков для разных ниш и форматов.']].map(x=>({icon:'scissors',title:x[0],desc:x[1],badge:'В работе'}));const published=ideas.slice(0,6).map(x=>({...x,icon:'circle-check',badge:'Опубликовано'}));function render(){ $('#overview').innerHTML=top('Вся система','Рабочая модель: контент, лиды, продажи и автоматизации.')+`<section class="metrics">${metric('1 460','Найдено заявок','Всего новых лидов<br>за всё время','users')}${metric('128','Ожидают ответа клиента','Потенциальные клиенты,<br>ожидающие ответа','clock')}${metric('22','В работе','Активные задачи<br>и процессы','briefcase-business')}${metric('1 970 000 ₽','Получено денег','Выручка за всё время<br>работы системы','wallet')}${metric('<span id="ytViews" class="loading">—</span>','Просмотров на YouTube','Shorts, опубликованные<br>за последние 30 дней','youtube')}</section><div class="section-head"><h2>Направления</h2><p>Подключённые рабочие модули.</p></div><section class="modules-top">${module('ReelsFinder','Актуальный проект поиска и разбора Reels.','Live','Vercel','radar',links.reelsfinder)}${module('Трафик','Рилсы, YouTube, нарративы, реклама и посевы.','22','источника','send')}${module('Воронки','Прогревы, алгоритмы и Telegram-воронки.','1 460','лидов','funnel')}</section><section class="modules-bottom">${module('Телеграмм канал','Публикации и органический рост канала.','maie_maei','открыть канал','send',links.telegram)}${module('Портфолио','Мои кейсы, проекты, результаты и отзывы.','Live','Vercel','briefcase-business',links.portfolio)}${module('Автоотклики','Автоматические ответы на подходящие заявки.','34','отклика сегодня','send')}${module('План дня','Задачи, приоритеты, фокус и прогресс.','6','задач сегодня','calendar-days')}</section>`;$('#reels').innerHTML=top('Рилсы','Основная CRM по коротким видео: идеи, монтаж, публикации и аналитика.')+`<section class="metrics">${metric('9','Идеи','Темы и хуки<br>для следующих роликов','lightbulb','click')} ${metric('6','В монтаже','Ролики, которые<br>сейчас в работе','scissors','click')} ${metric('6','Выпущено','Опубликованные<br>короткие видео','circle-check','click')} ${metric('<span id="ytViewsReels" class="loading">—</span>','Просмотров за 30 дней','YouTube Shorts<br>@AndreyLabs','youtube')} ${metric('Live','ReelsFinder','Актуальный сервис<br>на Vercel','radar','click')}</section><div class="section-head"><h2>Пайплайн</h2><p>Каждый этап — отдельная рабочая вкладка.</p></div><section class="pipeline">${reel({icon:'lightbulb',badge:'Идеи',title:'Идеи',desc:'Темы, хуки и референсы для новых роликов.',page:'ideas'},'')}${reel({icon:'scissors',badge:'В работе',title:'В монтаже',desc:'Видео, которые сейчас находятся в процессе монтажа.',page:'editing'},'edit')}${reel({icon:'circle-check',badge:'Опубликовано',title:'Выпущено',desc:'Готовые ролики, которые уже опубликованы.',page:'published'},'published')}</section><div class="section-head" style="margin-top:34px"><h2>Интеграции</h2><p>Связанные проекты и каналы.</p></div><section class="integrations">${reel({icon:'radar',badge:'Работает',title:'ReelsFinder',desc:'Открыть актуальный ReelsFinder.',url:links.reelsfinder},'')}${reel({icon:'youtube',badge:'Подключён',title:'YouTube',desc:'@AndreyLabs — источник статистики.',url:links.youtube},'')}${reel({icon:'send',badge:'Подключён',title:'Telegram',desc:'Канал maie_maei.',url:links.telegram},'')}</section>`;$('#ideas').innerHTML=top('Идеи','Темы, хуки и референсы для новых роликов.')+`<div class="grid">${ideas.map(x=>reel(x,'')).join('')}</div>`;$('#editing').innerHTML=top('В монтаже','Видео, которые сейчас находятся в процессе монтажа.')+`<div class="grid">${editing.map(x=>reel(x,'edit')).join('')}</div>`;$('#published').innerHTML=top('Выпущено','Видео, которые уже опубликованы.')+`<div class="grid">${published.map(x=>reel(x,'published')).join('')}</div>`;const ms=$$('#reels .metric.click');ms[0].dataset.go='ideas';ms[1].dataset.go='editing';ms[2].dataset.go='published';ms[3].dataset.url=links.reelsfinder}function icons(){requestAnimationFrame(()=>lucide.createIcons())}function clock(){const n=new Date(),d=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(n),t=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(n);$$('.dateText').forEach(x=>x.textContent=d);$$('.timeText').forEach(x=>x.textContent=t)}function page(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));history.replaceState(null,'','#'+id);icons();clock()}function wire(){$$('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));$$('[data-go]').forEach(x=>x.onclick=()=>page(x.dataset.go));$$('[data-url]').forEach(x=>x.onclick=()=>window.open(x.dataset.url,'_blank','noopener'))}async function youtube(){try{const r=await fetch('/api/youtube',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);['ytViews','ytViewsReels'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=new Intl.NumberFormat('ru-RU').format(j.views||0);e.classList.remove('loading');e.title=j.note||''}})}catch(e){console.error(e);['ytViews','ytViewsReels'].forEach(id=>{const x=document.getElementById(id);if(x){x.textContent='—';x.classList.remove('loading')}})}}render();wire();clock();setInterval(clock,30000);const login=$('#login'),app=$('#app'),form=$('#loginForm');function openApp(){login.classList.add('hidden');app.classList.remove('hidden');page(location.hash.slice(1)||'overview');youtube()}if(localStorage.getItem('andreysystem-auth')==='1')openApp();form.onsubmit=e=>{e.preventDefault();if($('#user').value.trim()==='Nekr'&&$('#pass').value==='property27981'){localStorage.setItem('andreysystem-auth','1');$('#err').textContent='';openApp()}else $('#err').textContent='Неверный логин или пароль'};icons();</script></body></html>
